name: Scrape 50 States for Ukraine rankings

on:
  schedule:
    # Runs at the top of every hour (UTC). GitHub may delay this by a few
    # minutes during high load - that's normal and fine for our purposes.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit data/ back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run scraper
        run: python3 scrape_rankings.py

      - name: Commit and push updated data
        run: |
          git config user.name "50states-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update rankings snapshot [automated]"
            git push
          fi